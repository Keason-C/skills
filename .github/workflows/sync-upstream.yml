name: sync-upstream-skills
on:
  schedule: [{ cron: "0 3 * * *" }]   # daily 03:00 UTC
  workflow_dispatch:                   # manual trigger for testing
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync upstream skills (sparse)
        run: |
          set -e
          : > /tmp/shas.txt
          # format: repo|path-in-repo|dest-dir-in-this-repo
          while IFS='|' read -r repo path dest; do
            git clone --depth 1 --filter=blob:none --sparse \
              "https://github.com/pydantic/$repo" "/tmp/$repo"
            git -C "/tmp/$repo" sparse-checkout set "$path"
            rsync -a --delete "/tmp/$repo/$path/" "./$dest/"
            echo "$repo@$(git -C "/tmp/$repo" rev-parse --short HEAD)" >> /tmp/shas.txt
          done <<'EOF'
          pydantic-ai|pydantic_ai_slim/pydantic_ai/.agents/skills/building-pydantic-ai-agents|building-pydantic-ai-agents
          pydantic|.agents/skills/pydantic|pydantic
          pydantic-ai-harness|pydantic_ai_harness/.agents/skills/pydantic-ai-harness|pydantic-ai-harness
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "skills-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "sync upstream skills ($(paste -sd', ' /tmp/shas.txt))"
          git push
