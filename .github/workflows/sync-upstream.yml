name: sync-upstream-skills
on:
  schedule: [{ cron: "0 3 * * *" }]   # daily 03:00 UTC
  workflow_dispatch:                   # manual trigger for testing
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync upstream skills (sparse)
        run: |
          set -e
          : > /tmp/shas.txt
          # format: owner/repo|path-in-repo|dest-dir ("*" = mirror each child dir to repo root)
          while IFS='|' read -r repo path dest; do
            tmp="/tmp/$(basename "$repo")"
            git clone --depth 1 --filter=blob:none --sparse \
              "https://github.com/$repo" "$tmp"
            git -C "$tmp" sparse-checkout set "$path"
            if [ "$dest" = "*" ]; then
              for d in "$tmp/$path"/*/; do
                rsync -a --delete "$d" "./$(basename "$d")/"
              done
            else
              rsync -a --delete "$tmp/$path/" "./$dest/"
            fi
            echo "$repo@$(git -C "$tmp" rev-parse --short HEAD)" >> /tmp/shas.txt
          done <<'EOF'
          pydantic/pydantic-ai|pydantic_ai_slim/pydantic_ai/.agents/skills/building-pydantic-ai-agents|building-pydantic-ai-agents
          pydantic/pydantic|.agents/skills/pydantic|pydantic
          pydantic/pydantic-ai-harness|pydantic_ai_harness/.agents/skills/pydantic-ai-harness|pydantic-ai-harness
          anthropics/skills|skills|*
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "skills-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "sync upstream skills ($(paste -sd', ' /tmp/shas.txt))"
          git push
