[project]
name = "procurement-qa"
version = "0.1.0"
description = "采购品类知识问答机器人(命令行)"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]

[dependency-groups]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
pqa = "procurement_qa.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
