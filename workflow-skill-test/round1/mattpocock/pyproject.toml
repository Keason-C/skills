[project]
name = "triagebot"
version = "0.1.0"
description = "Ticket triage where the LLM understands and deterministic rules decide"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
